name: Add random loading message
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject loader message script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./startMessage.js"></script>'
          if tag not in s:
              marker='<script src="https://cdn.jsdelivr.net/npm/typescript@5.9.2/lib/typescript.min.js"></script>'
              s=s.replace(marker, tag+marker, 1)
              p.write_text(s, encoding='utf-8')
          w=Path('.github/workflows/start-message.yml')
          if w.exists(): w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/start-message.yml
          git commit -m 'Ajoute les messages aléatoires au chargement' || exit 0
          git push
