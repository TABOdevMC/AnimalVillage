name: Improve graphics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Improve Three.js building visuals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts')
          s=p.read_text()
          old="else if(type==='quarry'){addBox(2.8,.8,2.8,0x777);for(let i=0;i<5;i++){const q=new THREE.Mesh(new THREE.DodecahedronGeometry(.45),material(0x777));q.position.set((Math.random()-.5)*2,.9,(Math.random()-.5)*2);g.add(q)}}"
          new="else if(type==='quarry'){addBox(2.8,.55,2.8,0x77716a);addBox(2.45,.28,2.35,0x9b9588,0,.55,0);for(let i=0;i<5;i++){const q=new THREE.Mesh(new THREE.DodecahedronGeometry(.42,0),material(i%2?0x686963:0x85867f));q.position.set((Math.random()-.5)*2.05,.95,(Math.random()-.5)*2.05);q.scale.set(1,.7+.2*Math.random(),.85+.25*Math.random());g.add(q)}const postMat=material(0x5b3925);for(const px of [-1.05,1.05]){const post=box(.16,1.45,.16,0x5b3925,px,.35,-.95);g.add(post)}const beam=box(2.25,.16,.16,0x5b3925,0,1.55,-.95);g.add(beam);const cart=box(.7,.22,.48,0x6b4a31,0,.28,.95);g.add(cart);for(let i=0;i<2;i++){const wheel=new THREE.Mesh(new THREE.TorusGeometry(.18,.055,6,10),material(0x3b3027));wheel.rotation.x=Math.PI/2;wheel.position.set(i? .26:-.26,.22,1.2);g.add(wheel)}}"
          if old not in s:
              raise SystemExit('quarry visual pattern not found')
          s=s.replace(old,new,1)
          old2="const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});"
          new2="const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78,metalness:0});"
          s=s.replace(old2,new2,1)
          old3="scene.add(new THREE.HemisphereLight(0xbddff0,0x203b25,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(15,25,10);sun.castShadow=true;scene.add(sun);"
          new3="scene.add(new THREE.HemisphereLight(0xd9efff,0x20351f,2.2));const sun=new THREE.DirectionalLight(0xfff4d6,2.8);sun.position.set(18,30,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;scene.add(sun);"
          s=s.replace(old3,new3,1)
          old4="const scene=new THREE.Scene();scene.background=new THREE.Color(0x87aeb8);scene.fog=new THREE.Fog(0x87aeb8,45,110);"
          new4="const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc4cc);scene.fog=new THREE.Fog(0x9fc4cc,55,125);"
          s=s.replace(old4,new4,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/graphics-fix.yml
          git add src/main.ts .github/workflows/graphics-fix.yml
          git commit -m 'fix: improve medieval building visuals' || exit 0
          git push