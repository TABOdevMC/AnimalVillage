name: Migrate AnimalVillage to TypeScript
on: push
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migration
        run: python3 tools/migrate.py
      - name: Install dependencies
        run: npm install
      - name: Verify build
        run: npm run build
      - name: Commit migration
        run: |
          rm -f .ts-migration-trigger .ts-build-trigger .ts-build-trigger-2 .ts-build-trigger-3 .ts-build-trigger-4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: migrate game to TypeScript and add admin menu' || exit 0
          git push
