name: Upgrade all building graphics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish building renderer
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.ts')
          s=p.read_text()
          marker="const g=new THREE.Group();const addBox=(w,h,d,c)=>g.add(box(w,h,d,c));"
          inject="""const g=new THREE.Group();const addBox=(w,h,d,c)=>g.add(box(w,h,d,c));const styleBuilding=(type)=>{const stone=0x77746b,wood=0x5a3928,dark=0x3d3029,glass=0xa8c8c8,gold=0xc59a52;const door=(x,z,w=.62,h=1.05)=>addBox(w,h,.1,dark,x,.28,z);const window=(x,z)=>{addBox(.5,.48,.08,glass,x,.95,z);addBox(.07,.58,.1,wood,x-.28,.9,z);addBox(.07,.58,.1,wood,x+.28,.9,z);};if(['house','lumber','mine','market','granary','warehouse','tavern','bakery','blacksmith','mill','barracks'].includes(type))door(0,1.4,type==='warehouse'?1:0.62,type==='warehouse'?1.35:1.05);if(['house','lumber','granary','warehouse','tavern','bakery','barracks','university'].includes(type)){window(-.8,1.38);window(.8,1.38)}if(['quarry','mine','blacksmith','vault','tower','wall'].includes(type)){addBox(2.55,.16,2.55,stone,0,.3,0)}if(type==='house'||type==='tavern'||type==='university'){const c=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.65,8),material(wood));c.position.set(.9,2.35,-.9);c.castShadow=true;g.add(c);addBox(.28,.1,.28,gold,.9,2.98,-.9)}if(type==='market'){for(const px of [-1,1])addBox(.12,.75,.12,wood,px,.3,.95);for(const px of [-.65,.65])cyl(.18,.32,0x8d6338,px,.28,.7)}if(type==='farm'){for(let i=-1;i<=1;i++){addBox(.12,.65,.12,wood,i*1.45,.3,-1.55);addBox(.12,.65,.12,wood,i*1.45,.3,1.55)}addBox(3.1,.1,.1,wood,0,.78,-1.55);addBox(3.1,.1,.1,wood,0,.78,1.55)}if(type==='lumber'||type==='warehouse'){for(let i=-1;i<=1;i++)addBox(.55,.35,.55,0x76502f,i*.68,.35,.9)}if(type==='mine'){addBox(.28,.9,.28,wood,-.72,.3,1.22);addBox(.28,.9,.28,wood,.72,.3,1.22);addBox(1.65,.16,.16,wood,0,1.18,1.22)}if(type==='quarry'){addBox(.18,.95,.18,wood,-.85,.3,.8);addBox(.18,.95,.18,wood,.85,.3,.8);addBox(1.7,.14,.14,wood,0,1.12,.8)}if(type==='blacksmith'){cyl(.42,.14,dark,-.72,.48,.62,8);addBox(.24,1.4,.24,dark,.85,.3,-.75)}if(type==='bakery'){cyl(.42,.18,0xb7a27b,-.72,.4,.65,8);addBox(.28,1.2,.28,wood,.92,.3,.72)}if(type==='mill'){addBox(.16,3.0,.16,wood,0,1.0,1.18)}if(type==='tower'){for(let i=0;i<4;i++){const a=i*Math.PI/2;addBox(.18,.75,.18,wood,Math.sin(a)*.88,.35,Math.cos(a)*.88)}}if(type==='wall'){for(let i=-1;i<=1;i++)addBox(.6,.22,.9,stone,i*.95,2.78,0)}if(type==='university'){cyl(.18,.9,wood,0,3.15,0,8);addBox(.1,1.45,.1,gold,0,4.0,0)}if(type==='vault'){addBox(.9,1.1,.08,gold,0,.75,1.38)}if(type==='granary'){for(let i=-1;i<=1;i++)addBox(.1,1.5,.12,wood,i*.72,.95,-1.28)}if(type==='barracks'){addBox(.7,1.0,.1,dark,0,.35,1.78)}};"""
          if marker not in s: raise SystemExit('visual marker not found')
          s=s.replace(marker,inject,1)
          end="g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);return g}"
          if end not in s: raise SystemExit('visual end not found')
          s=s.replace(end,"styleBuilding(type);g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);return g}",1)
          p.write_text(s)
          PY
      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          if ! git diff --cached --quiet; then git commit -m 'feat: polish all building graphics'; git push; fi
          git rm -f .github/workflows/graphics-upgrade.yml || true
          git commit -m 'chore: remove temporary graphics workflow' || true
          git push || true
