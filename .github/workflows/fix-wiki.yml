name: Fix Wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wiki close and bootstrap parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<div id="wikiWin" class="window"><h3>📖 Wiki d\'AnimalVillage</h3>', '<div id="wikiWin" class="window"><h3>📖 Wiki d\'AnimalVillage <button id="wikiClose" style="float:right">✕</button></h3>')
          s=s.replace("document.getElementById('wikiBtn').onclick=()=>document.getElementById('wikiWin').classList.toggle('open')", "document.getElementById('wikiBtn').onclick=()=>document.getElementById('wikiWin').classList.toggle('open');document.getElementById('wikiClose')?.addEventListener('click',()=>document.getElementById('wikiWin').classList.remove('open'))")
          # Avoid regex literals in the bootstrap script; RegExp has identical behavior and prevents parser edge cases.
          s=s.replace(".replace(/from ['\\\"]three['\\\"]/g,", ".replace(new RegExp(\"from ['\\\\\\\"]three['\\\\\\\"]\",'g'),")
          s=s.replace(".replace(/from ['\\\"]\\.\\/admin['\\\"]/g,", ".replace(new RegExp(\"from ['\\\\\\\"]\\\\.\\\\/admin['\\\\\\\"]\",'g'),")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "fix wiki close and bootstrap syntax"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/fix-wiki.yml || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "remove temporary wiki fix workflow" || true
          git push || true
