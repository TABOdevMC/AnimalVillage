name: Optimize villagers performance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'villagerBodyGeo' in s:
              print('already patched')
          else:
              s=s.replace("new THREE.WebGLRenderer({antialias:true})", "new THREE.WebGLRenderer({antialias:false})", 1)
              s=s.replace("renderer.setPixelRatio(Math.min(devicePixelRatio,2))", "renderer.setPixelRatio(Math.min(devicePixelRatio,1.25))", 1)
              old="function createVillager(id){const g=new THREE.Group();g.add(box(.38,.7,.3,0xc89d72));const head=new THREE.Mesh(new THREE.SphereGeometry(.2,10,10),material(0xd8b18a));head.position.y=.85;g.add(head);g.position.set((Math.random()-.5)*12,0,(Math.random()-.5)*12);scene.add(g);return{id,mesh:g,target:new THREE.Vector3((Math.random()-.5)*18,0,(Math.random()-.5)*18),speed:1+Math.random(),hunger:100,energy:100,state:'Se promène',job:'Libre'}}"
              new="const villagerBodyGeo=new THREE.BoxGeometry(.38,.7,.3),villagerHeadGeo=new THREE.SphereGeometry(.2,6,6),villagerBodyMat=material(0xc89d72),villagerHeadMat=material(0xd8b18a);function createVillager(id){const g=new THREE.Group();const body=new THREE.Mesh(villagerBodyGeo,villagerBodyMat);body.position.y=.35;const head=new THREE.Mesh(villagerHeadGeo,villagerHeadMat);head.position.y=.85;g.add(body,head);g.position.set((Math.random()-.5)*12,0,(Math.random()-.5)*12);scene.add(g);return{id,mesh:g,target:new THREE.Vector3((Math.random()-.5)*18,0,(Math.random()-.5)*18),speed:1+Math.random(),hunger:100,energy:100,state:'Se promène',job:'Libre'}}"
              if old not in s: raise SystemExit('createVillager pattern not found')
              s=s.replace(old,new,1)
              s=s.replace("syncVillagers();updateUI();renderWeather()},1000)", "syncVillagers();updateUI();renderWeather()},1000)", 1)
              # Move NPCs in the render loop without doing AI/DOM work every frame.
              marker="function renderPeople(){peopleRows.innerHTML=villagers.slice(0,18).map(v=>'<section>👤 Villageois '+v.id+'<br><span class=\"small\">'+v.job+' · '+v.state+'<br>Faim '+Math.round(v.hunger)+'% · Énergie '+Math.round(v.energy)+'%</span></section>').join('')}"
              if marker in s:
                  s=s.replace(marker, marker+"function moveVillagers(dt){villagers.forEach(v=>{const d=v.target.clone().sub(v.mesh.position);d.y=0;if(d.lengthSq()>.0625)v.mesh.position.addScaledVector(d.normalize(),.035*v.speed*Math.min(dt*60,2))})}",1)
              oldanim="camera.position.y=Math.max(1.2,camera.position.y);camera.lookAt(camera.position.clone().add(new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch))));renderer.render(scene,camera)"
              newanim="camera.position.y=Math.max(1.2,camera.position.y);camera.lookAt(camera.position.clone().add(new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch))));moveVillagers(dt);renderer.render(scene,camera)"
              if oldanim not in s: raise SystemExit('animate pattern not found')
              s=s.replace(oldanim,newanim,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/performance-villagers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/performance-villagers.yml
          git commit -m '[bot] optimize villagers performance' || exit 0
          git push