name: Fix generated save API syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fix and verify
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts');s=p.read_text();s=s.replace('\\\\n','\n');p.write_text(s)
          PY
          rm -f .github/workflows/fix-main-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts .github/workflows/fix-main-syntax.yml
          git commit -m 'fix: repair save api syntax'
          git push
          npm install --no-audit --no-fund
          npm run build
