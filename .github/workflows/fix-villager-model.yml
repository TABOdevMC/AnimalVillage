name: Patch villager model
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve villager model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.ts')
          s=p.read_text()
          s=re.sub(r"const villagerBodyGeo=.*?;", "const villagerBodyGeo=new THREE.CapsuleGeometry(.19,.38,4,8),villagerHeadGeo=new THREE.SphereGeometry(.205,10,8),villagerArmGeo=new THREE.CapsuleGeometry(.065,.34,3,6),villagerLegGeo=new THREE.CapsuleGeometry(.075,.25,3,6),villagerBootGeo=new THREE.BoxGeometry(.16,.11,.23),villagerHairGeo=new THREE.SphereGeometry(.21,10,7),villagerBeltGeo=new THREE.BoxGeometry(.43,.07,.33),villagerNeckGeo=new THREE.CylinderGeometry(.075,.08,.11,8),villagerEarGeo=new THREE.SphereGeometry(.045,6,5),villagerNoseGeo=new THREE.SphereGeometry(.035,6,5);", s, count=1)
          pattern=r"function createVillager\(id\)\{.*?\}function syncVillagers"
          replacement="""function createVillager(id){const g=new THREE.Group(),cloth=fabricMats[id%fabricMats.length];const body=new THREE.Mesh(villagerBodyGeo,cloth);body.position.y=.68;const neck=new THREE.Mesh(villagerNeckGeo,skinMat);neck.position.y=1.08;const head=new THREE.Mesh(villagerHeadGeo,skinMat);head.position.y=1.29;const hair=new THREE.Mesh(villagerHairGeo,hairMat);hair.scale.set(1.02,.58,1.02);hair.position.set(0,1.4,-.015);const belt=new THREE.Mesh(villagerBeltGeo,beltMat);belt.position.y=.47;const leftArm=new THREE.Mesh(villagerArmGeo,cloth);leftArm.position.set(-.245,.72,0);leftArm.rotation.z=-.12;const rightArm=new THREE.Mesh(villagerArmGeo,cloth);rightArm.position.set(.245,.72,0);rightArm.rotation.z=.12;const leftLeg=new THREE.Mesh(villagerLegGeo,bootMat);leftLeg.position.set(-.105,.23,0);const rightLeg=new THREE.Mesh(villagerLegGeo,bootMat);rightLeg.position.set(.105,.23,0);const leftBoot=new THREE.Mesh(villagerBootGeo,bootMat);leftBoot.position.set(-.105,.055,.055);const rightBoot=new THREE.Mesh(villagerBootGeo,bootMat);rightBoot.position.set(.105,.055,.055);const leftEar=new THREE.Mesh(villagerEarGeo,skinMat);leftEar.position.set(-.205,1.29,0);const rightEar=new THREE.Mesh(villagerEarGeo,skinMat);rightEar.position.set(.205,1.29,0);const nose=new THREE.Mesh(villagerNoseGeo,skinMat);nose.position.set(0,1.28,.2);g.add(body,neck,head,hair,belt,leftArm,rightArm,leftLeg,rightLeg,leftBoot,rightBoot,leftEar,rightEar,nose);g.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false}});g.position.set((Math.random()-.5)*12,0,(Math.random()-.5)*12);scene.add(g);return{id,mesh:g,target:new THREE.Vector3((Math.random()-.5)*18,0,(Math.random()-.5)*18),speed:1+Math.random(),hunger:100,energy:100,state:'Se promène',job:'Libre'}}function syncVillagers"""
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('createVillager function not found')
          p.write_text(ns)
          PY
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts .github/workflows/fix-villager-model.yml
          git commit -m 'feat: improve villager 3D model'
          git push
          git rm .github/workflows/fix-villager-model.yml
          git commit -m 'chore: remove villager model patch workflow'
          git push
