name: Repair weather DOM collision

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[bot] fix weather DOM collision')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JavaScript global collision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("weather='beau'", "currentWeather='beau'")
          s = s.replace("weather=names[i]", "currentWeather=names[i]")
          s = s.replace("weatherDefs[weather]", "weatherDefs[currentWeather]")
          s = s.replace("weather==='canicule'", "currentWeather==='canicule'")
          s = s.replace("weather==='pluie'", "currentWeather==='pluie'")
          s = s.replace("weather==='torrentielle'", "currentWeather==='torrentielle'")
          s = s.replace("weather==='ouragan'", "currentWeather==='ouragan'")
          s = s.replace("weather==='blizzard'", "currentWeather==='blizzard'")
          s = s.replace("weather.textContent", "weatherEl.textContent")
          marker = "let climate={t:.55,h:.62,w:.35},season='printemps',currentWeather='beau'"
          if marker in s and "const weatherEl=document.getElementById('weather');" not in s:
              s = s.replace(marker, marker+";const weatherEl=document.getElementById('weather');", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          rm -f .github/workflows/repair-weather-dom.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/repair-weather-dom.yml
          git diff --cached --quiet && exit 0
          git commit -m '[bot] fix weather DOM collision'
          git push
