name: Fix weatherClock const
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix mutable weatherClock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('const weatherEl=document.getElementById(\'weather\'),weatherClock=', 'const weatherEl=document.getElementById(\'weather\');let weatherClock=')
          s=s.replace('const weatherEl=document.getElementById("weather"),weatherClock=', 'const weatherEl=document.getElementById("weather");let weatherClock=')
          s=s.replace('const weatherClock=', 'let weatherClock=')
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/fix-weather-clock2.yml
          git commit -m "[bot] fix mutable weather clock" || true
          git rm .github/workflows/fix-weather-clock2.yml || true
          git commit -m "[bot] remove temporary weather fix workflow" || true
          git push