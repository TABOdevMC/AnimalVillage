name: Finalize AnimalVillage TypeScript
on: push
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/migrate.py
      - run: npm install
      - run: npm run build
      - name: Commit generated app
        run: |
          rm -f .ts-final-trigger .ts-build-trigger-4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!node_modules' ':!dist'
          git commit -m 'refactor: migrate game to TypeScript and add admin menu' || exit 0
          git push
