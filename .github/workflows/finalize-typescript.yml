name: Finalize AnimalVillage TypeScript
on: push
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/migrate.py
      - run: npm install
      - run: npm run build
      - name: Write generated files through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          index_sha=$(git rev-parse HEAD:index.html)
          index_b64=$(base64 -w0 index.html)
          gh api --method PUT repos/TABOdevMC/AnimalVillage/contents/index.html -f message='refactor: move game entry to TypeScript' -f content="$index_b64" -f sha="$index_sha" -f branch=main
          main_b64=$(base64 -w0 src/main.ts)
          gh api --method PUT repos/TABOdevMC/AnimalVillage/contents/src/main.ts -f message='refactor: add TypeScript game entry' -f content="$main_b64" -f branch=main
          gh api --method DELETE repos/TABOdevMC/AnimalVillage/contents/.api-final-trigger -f message='chore: remove migration trigger' -f sha="$(git rev-parse HEAD:.api-final-trigger)" -f branch=main || true
