<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimalVillage</title><style>
:root{--glass:rgba(18,30,23,.9);--line:rgba(255,255,255,.15);--gold:#f2c65d;--green:#9bd18b;--text:#f7f4e8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#102719;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}canvas{image-rendering:auto}button{border:1px solid rgba(255,255,255,.11);border-radius:9px;padding:7px 10px;margin:2px;background:linear-gradient(180deg,#ffffff14,#ffffff08);color:#fff;cursor:pointer;transition:.16s transform,.16s background,.16s border;box-shadow:0 2px 8px #0003}button:hover{background:#ffffff22;border-color:#ffffff30;transform:translateY(-1px)}button:active{transform:translateY(0)}button:disabled{opacity:.4;cursor:not-allowed;transform:none}.danger{background:#702d2d!important}.small{opacity:.72;font-size:11px}.row{display:flex;justify-content:space-between;gap:8px}#loader{position:fixed;z-index:9999;inset:0;background:radial-gradient(circle at 50% 38%,#285b36,#102719 62%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;transition:opacity .55s ease}#loader.hide{opacity:0;pointer-events:none}#loader h1{font-size:36px;letter-spacing:.5px;margin:0 0 10px;text-shadow:0 5px 25px #0008}.loaderSub{opacity:.72;margin-bottom:22px}.loadingBar{width:min(360px,72vw);height:9px;background:#ffffff13;border:1px solid #ffffff15;border-radius:99px;overflow:hidden;box-shadow:0 4px 20px #0005}.loadingBar i{display:block;width:35%;height:100%;background:linear-gradient(90deg,#6d9e61,#d6e89d,#6d9e61);border-radius:99px;animation:loading 1.15s ease-in-out infinite}@keyframes loading{0%{transform:translateX(-130%)}100%{transform:translateX(390%)}}
#ui{position:fixed;z-index:5;inset:10px 10px auto;display:flex;gap:8px;pointer-events:none}#panel,.window{background:linear-gradient(145deg,rgba(18,35,26,.93),rgba(0,0,0,.8));border:1px solid var(--line);border-radius:15px;padding:11px;box-shadow:0 12px 40px #0008,inset 0 1px #ffffff0c;backdrop-filter:blur(12px)}#panel{min-width:410px;pointer-events:auto}.title{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px;letter-spacing:.2px}.titleBadge{font-size:10px;opacity:.55;font-weight:600}#res{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.res{background:linear-gradient(145deg,#ffffff10,#ffffff06);border:1px solid #ffffff0b;border-radius:9px;padding:5px 3px;text-align:center;font-size:9px;box-shadow:inset 0 1px #fff1}.res b{display:block;font-size:15px;line-height:18px}.wood{color:#d69b62}.food{color:#9bd879}.stone{color:#c4c7c5}.metal{color:#d9e0e5}.gold{color:var(--gold)}#stats,#researchPoints{margin-top:6px;padding:4px 6px;background:#0004;border-radius:7px}#researchPoints{color:#e8d78d}.window{position:fixed;z-index:8;top:70px;right:12px;width:410px;max-height:78vh;overflow:auto;display:none;pointer-events:auto}.window.open{display:block;animation:pop .16s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}.window h3{margin:2px 0 12px;font-size:17px;border-bottom:1px solid #fff1;padding-bottom:8px}.window section{padding:8px 0;border-bottom:1px solid #fff0}.bar{height:7px;background:#fff1;border-radius:5px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6d9e61,#b8dc8c);box-shadow:0 0 10px #9bd18b55}#msg{position:fixed;z-index:20;bottom:76px;left:50%;transform:translateX(-50%);background:linear-gradient(145deg,#15261bd9,#000ed9);border:1px solid #fff2;padding:9px 14px;border-radius:10px;box-shadow:0 8px 25px #0008;opacity:0;transition:.2s;pointer-events:none}#tools{position:fixed;z-index:5;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:96vw;padding:7px 9px;border:1px solid #fff1;border-radius:14px;background:#07150dd9;backdrop-filter:blur(9px);box-shadow:0 10px 30px #0008;pointer-events:auto}#tools button{font-size:11px;padding:6px 8px}#adminWin{left:12px;right:auto;width:370px;max-height:80vh}#adminWin button{width:calc(50% - 8px)}#climate{display:none}@media(max-width:650px){#panel{min-width:0;width:calc(100vw - 20px)}.window{left:10px;right:10px;width:auto;top:145px}#res{gap:3px}.res{font-size:8px}.res b{font-size:13px}}
</style></head><body><div id="loader"><h1>🏰 AnimalVillage</h1><div class="loaderSub">Le village se réveille...</div><div class="loadingBar"><i></i></div></div><div id="ui"><div id="panel"><div class="title"><span>🏰 AnimalVillage</span><span class="titleBadge">ROYAUME</span></div><div id="res"><div class="res wood">🪵<b id="wood">120</b>Bois</div><div class="res food">🌾<b id="food">100</b>Nourriture</div><div class="res stone">🪨<b id="stone">80</b>Pierre</div><div class="res metal">⚙️<b id="metal">40</b>Métaux</div><div class="res gold">🪙<b id="gold">250</b>Monnaie</div></div><div class="small" id="stats"></div><div class="small" id="researchPoints">🔬 Points de technologie : 0</div><div id="weather"></div><div class="small" id="climate"></div><button id="marketBtn">🪙 Commerce</button><button id="armyBtn">⚔️ Armée</button><button id="techBtn">🔬 Technologies</button><button id="peopleBtn">👥 Villageois</button><button id="weatherBtn">🌦️ Météo</button></div></div><div id="market" class="window"><h3>🪙 Commerce</h3><div id="marketRows"></div></div><div id="army" class="window"><h3>⚔️ Armée</h3><div id="armyInfo"></div><button id="train">Former un soldat</button><button id="disband" class="danger">Renvoyer</button></div><div id="tech" class="window"><h3>🔬 Technologies</h3><div id="techRows"></div><button id="gainTech">🔬 Obtenir +10 points</button></div><div id="people" class="window"><h3>👥 Villageois</h3><div id="peopleRows"></div></div><div id="weatherWin" class="window"><h3>🌦️ Météo & climat</h3><div id="weatherInfo"></div></div><div id="adminWin" class="window"><h3>🛠️ Admin / Debug</h3><div class="small">Touche Z pour ouvrir ou fermer</div><div id="adminInfo" class="small" style="margin:8px 0"></div><button id="adminResources">💰 Ressources max</button><button id="adminSoldiers">⚔️ +100 soldats</button><button id="adminTech">🔬 Toutes les technologies</button><button id="adminFinish">🏗️ Finir constructions</button><button id="adminRepair">❤️ Réparer bâtiments</button><button id="adminWeather">🌦️ Changer météo</button><button id="adminFree">🏠 Construction gratuite</button><button id="adminClear" class="danger">🧹 Supprimer bâtiments</button></div><div id="msg"></div><div id="tools"></div><script src="https://cdn.jsdelivr.net/npm/typescript@5.9.2/lib/typescript.min.js"></script><script>window.addEventListener('load',async()=>{const loader=document.getElementById('loader');try{const get=async p=>(await fetch(p,{cache:'no-store'})).text();const [mainSrc,adminSrc]=await Promise.all([get('./src/main.ts'),get('./src/admin.ts')]);const adminJs=ts.transpileModule(adminSrc,{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2020}}).outputText;const adminUrl=URL.createObjectURL(new Blob([adminJs],{type:'text/javascript'}));const mainTs=mainSrc.replace(/from ['\"]three['\"]/g,'from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"').replace(/from ['\"]\.\/admin['\"]/g,'from "'+adminUrl+'"');const mainJs=ts.transpileModule(mainTs,{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2020}}).outputText;const mainUrl=URL.createObjectURL(new Blob([mainJs],{type:'text/javascript'}));await import(mainUrl);setTimeout(()=>URL.revokeObjectURL(mainUrl),60000);setTimeout(()=>URL.revokeObjectURL(adminUrl),60000);loader.classList.add('hide');setTimeout(()=>loader.remove(),500)}catch(e){console.error('AnimalVillage bootstrap error',e);loader.innerHTML='<h1>⚠️ AnimalVillage</h1><p>Erreur pendant le chargement du jeu.</p><p class="small">'+(e?.message||e)+'</p>'}});</script><script src="./visualEnhancements.js"></script><script src="./weatherVisuals.js"></script></body></html>
