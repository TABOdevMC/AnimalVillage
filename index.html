<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AnimalVillage — Three.js</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif}
    #info{position:fixed;top:12px;left:12px;padding:10px 12px;border-radius:10px;background:#0009;color:#fff;z-index:2}
  </style>
</head>
<body>
  <div id="info"><b>AnimalVillage — Three.js</b><br>Drag = tourner · Wheel = zoom</div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 25, 70);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(10, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x6b7d45, 2));
    const sun = new THREE.DirectionalLight(0xffffff, 3);
    sun.position.set(8, 14, 6);
    sun.castShadow = true;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color: 0x6aa84f, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    function box(x,y,z,sx,sy,sz,color){
      const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color}));
      m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
    }

    // Maison
    box(0,1,0,4,2,3,0xf2d39b);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.8,1.8,4),new THREE.MeshStandardMaterial({color:0x9b3d30}));
    roof.position.set(0,2.9,0); roof.rotation.y=Math.PI/4; roof.castShadow=true; scene.add(roof);
    box(0,0.75,1.56,1,1.5,0.12,0x6d4c41);
    box(-1.25,1.25,1.56,0.75,0.75,0.12,0x75b8e7);
    box(1.25,1.25,1.56,0.75,0.75,0.12,0x75b8e7);

    // Arbres
    for(let i=0;i<14;i++){
      const x=(Math.random()-0.5)*35, z=(Math.random()-0.5)*35;
      if(Math.hypot(x,z)<5){ i--; continue; }
      box(x,1,z,0.45,2,0.45,0x795548);
      const crown=new THREE.Mesh(new THREE.SphereGeometry(1.4,12,8),new THREE.MeshStandardMaterial({color:0x2f7d32}));
      crown.position.set(x,2.5,z); crown.castShadow=true; scene.add(crown);
    }

    // Animal de test
    const animal = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2,1,1),new THREE.MeshStandardMaterial({color:0xc9a66b}));
    body.castShadow=true; animal.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9),new THREE.MeshStandardMaterial({color:0xd7b57d}));
    head.position.set(1.25,0.35,0); head.castShadow=true; animal.add(head);
    for(const z of [-0.35,0.35]){
      const ear=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.5,4),new THREE.MeshStandardMaterial({color:0x9b7048}));
      ear.position.set(1.25,0.95,z); ear.rotation.x=Math.PI/2; ear.castShadow=true; animal.add(ear);
    }
    for(const x of [-0.65,0.65]) for(const z of [-0.3,0.3]){
      const leg=new THREE.Mesh(new THREE.BoxGeometry(0.25,1,0.25),new THREE.MeshStandardMaterial({color:0x8b6b4a}));
      leg.position.set(x,-0.85,z); leg.castShadow=true; animal.add(leg);
    }
    animal.position.set(0,2,5);
    scene.add(animal);

    function animate(){
      requestAnimationFrame(animate);
      animal.rotation.y += 0.003;
      controls.update();
      renderer.render(scene,camera);
    }
    animate();

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
