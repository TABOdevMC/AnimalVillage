<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimalVillage</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#102719;color:#fff;font-family:system-ui}#ui{position:fixed;z-index:5;inset:10px 10px auto;display:flex;gap:8px;pointer-events:none}#panel,.window{background:#000d;border:1px solid #ffffff22;border-radius:12px;padding:10px;box-shadow:0 8px 30px #0006;backdrop-filter:blur(6px)}#panel{min-width:390px;pointer-events:auto}.window{position:fixed;z-index:8;top:70px;right:12px;width:390px;max-height:78vh;overflow:auto;display:none;pointer-events:auto}.window.open{display:block}.small{opacity:.72;font-size:11px}.row{display:flex;justify-content:space-between;gap:8px}#res{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}.res{background:#fff1;border-radius:7px;padding:4px;text-align:center;font-size:10px}.res b{display:block;font-size:15px}.wood{color:#d69b62}.food{color:#8fd36b}.stone{color:#aaa}.metal{color:#ddd}.gold{color:#ffd65c}button{border:0;border-radius:7px;padding:6px 8px;margin:2px;background:#fff2;color:#fff;cursor:pointer}button:hover{background:#fff3}button:disabled{opacity:.4;cursor:not-allowed}.danger{background:#712b2b}.bar{height:6px;background:#fff2;border-radius:4px;overflow:hidden;margin:3px 0 7px}.bar i{display:block;height:100%;background:#9bd18b}#msg{position:fixed;z-index:9;bottom:68px;left:50%;transform:translateX(-50%);background:#000e;padding:9px 14px;border-radius:10px;opacity:0;transition:.2s}#tools{position:fixed;z-index:5;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw;pointer-events:auto}#adminWin{left:12px;right:auto;width:360px;max-height:80vh}#adminWin button{width:calc(50% - 8px)}#climate{display:none}</style></head><body><div id="ui"><div id="panel"><b>🏰 AnimalVillage</b><div id="res"><div class="res wood">🪵<b id="wood">120</b>Bois</div><div class="res food">🌾<b id="food">100</b>Nourriture</div><div class="res stone">🪨<b id="stone">80</b>Pierre</div><div class="res metal">⚙️<b id="metal">40</b>Métaux</div><div class="res gold">🪙<b id="gold">250</b>Monnaie</div></div><div class="small" id="stats"></div><div id="weather"></div><div class="small" id="climate"></div><button id="marketBtn">🪙 Commerce</button><button id="armyBtn">⚔️ Armée</button><button id="techBtn">🔬 Technologies</button><button id="peopleBtn">👥 Villageois</button><button id="weatherBtn">🌦️ Météo</button></div></div><div id="market" class="window"><h3>🪙 Commerce</h3><div id="marketRows"></div></div><div id="army" class="window"><h3>⚔️ Armée</h3><div id="armyInfo"></div><button id="train">Former un soldat</button><button id="disband" class="danger">Renvoyer</button></div><div id="tech" class="window"><h3>🔬 Technologies</h3><div id="techRows"></div></div><div id="people" class="window"><h3>👥 Villageois</h3><div id="peopleRows"></div></div><div id="weatherWin" class="window"><h3>🌦️ Météo & climat</h3><div id="weatherInfo"></div></div><div id="adminWin" class="window"><h3>🛠️ Admin / Debug</h3><div class="small">Touche Z pour ouvrir ou fermer</div><div id="adminInfo" class="small" style="margin:8px 0"></div><button id="adminResources">💰 Ressources max</button><button id="adminSoldiers">⚔️ +100 soldats</button><button id="adminTech">🔬 Toutes les technologies</button><button id="adminFinish">🏗️ Finir constructions</button><button id="adminRepair">❤️ Réparer bâtiments</button><button id="adminWeather">🌦️ Changer météo</button><button id="adminFree">🏠 Construction gratuite</button><button id="adminClear" class="danger">🧹 Supprimer bâtiments</button></div><div id="msg"></div><div id="tools"></div><script src="https://cdn.jsdelivr.net/npm/typescript@5.9.2/lib/typescript.min.js"></script><script>window.addEventListener('load',async()=>{try{const get=async p=>(await fetch(p,{cache:'no-store'})).text();const [mainSrc,adminSrc]=await Promise.all([get('./src/main.ts'),get('./src/admin.ts')]);const adminJs=ts.transpileModule(adminSrc,{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2020}}).outputText;const adminUrl=URL.createObjectURL(new Blob([adminJs],{type:'text/javascript'}));const mainTs=mainSrc.replace(/from ['"]three['"]/g,'from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"').replace(/from ['"]\.\/admin['"]/g,'from "'+adminUrl+'"');const mainJs=ts.transpileModule(mainTs,{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2020}}).outputText;const mainUrl=URL.createObjectURL(new Blob([mainJs],{type:'text/javascript'}));await import(mainUrl);setTimeout(()=>URL.revokeObjectURL(mainUrl),60000);setTimeout(()=>URL.revokeObjectURL(adminUrl),60000)}catch(e){console.error('AnimalVillage bootstrap error',e);const m=document.getElementById('msg');if(m){m.textContent='Erreur de chargement : '+e.message;m.style.opacity='1'}}});</script><script src="./weatherVisuals.js"></script></body></html>
