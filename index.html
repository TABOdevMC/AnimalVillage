<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimalVillage</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#102719;color:#f7f4e8;font-family:system-ui,sans-serif}.window{display:none}button{cursor:pointer}</style></head><body><div id="panel"><b>🏰 AnimalVillage</b><div id="res"><span id="wood">120</span><span id="food">100</span><span id="stone">80</span><span id="metal">40</span><span id="gold">250</span></div><div id="stats"></div><div id="researchPoints">🔬 Points de technologie : 0</div><div id="weather"></div><div id="climate"></div><button id="marketBtn">🪙 Commerce</button><button id="armyBtn">⚔️ Armée</button><button id="techBtn">🔬 Technologies</button><button id="peopleBtn">👥 Villageois</button><button id="weatherBtn">🌦️ Météo</button><button id="wikiBtn">📖 Wiki</button><button id="settingsBtn">⚙️ Paramètres</button></div><div id="market" class="window"><div id="marketRows"></div></div><div id="army" class="window"><div id="armyInfo"></div><button id="train">Former</button><button id="disband">Renvoyer</button></div><div id="tech" class="window"><div id="techRows"></div><button id="gainTech">+10 recherche</button></div><div id="people" class="window"><div id="peopleRows"></div></div><div id="weatherWin" class="window"><div id="weatherInfo"></div></div><div id="wikiWin" class="window"><button id="wikiClose">✕</button></div><div id="settingsWin" class="window"><input id="volumeRange" type="range"><span id="volumeValue"></span><select id="qualitySelect"><option>medium</option></select><button id="animToggle"></button><button id="compactToggle"></button></div><div id="adminWin" class="window"></div><div id="msg"></div><div id="tools"></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';window.addEventListener('load',async()=>{const loader=document.createElement('div');loader.style='position:fixed;inset:0;z-index:9999;background:#102719;display:grid;place-items:center;font-size:22px';loader.textContent='🏰 AnimalVillage · chargement…';document.body.appendChild(loader);try{const ts=await import('https://cdn.jsdelivr.net/npm/typescript@5.9.2/lib/typescript.js');const get=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.text()};let [mainSrc,adminSrc]=await Promise.all([get('./src/main.ts'),get('./src/admin.ts')]);mainSrc=mainSrc.replace("import * as THREE from 'three';",'').replace("import { installAdmin } from './admin';",'');adminSrc=adminSrc.replace('export function installAdmin','function installAdmin');const opt={module:0,target:7};const adminJs=ts.transpileModule(adminSrc,{compilerOptions:opt}).outputText+'\nwindow.installAdmin=installAdmin;';new Function('THREE',adminJs)(THREE);mainSrc=mainSrc.replace('installAdmin({','window.installAdmin({');const mainJs=ts.transpileModule(mainSrc,{compilerOptions:opt}).outputText;new Function('THREE',mainJs)(THREE);loader.remove()}catch(e){console.error('AnimalVillage bootstrap error',e);loader.textContent='❌ Erreur de chargement : '+e.message;loader.style.color='#ff9b9b'}});</script></body></html>
